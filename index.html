<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRUD de Usuarios</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .btn { padding: 5px 10px; cursor: pointer; border: none; border-radius: 3px; }
    .btn-primary { background: #007bff; color: white; }
    .btn-warning { background: #ffc107; }
    .btn-danger { background: #dc3545; color: white; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); }
    .modal-content { background: white; width: 350px; margin: 100px auto; padding: 20px; }
  </style>
</head>
<body>

  <h2>Gestión de Usuarios</h2>
  <button class="btn btn-primary" onclick="abrirModal()">+ Nuevo Usuario</button>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Apellidos</th>
        <th>Correo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="usuarios-tabla"></tbody>
  </table>

  <!-- Modal -->
  <div id="modal-usuario" class="modal">
    <div class="modal-content">
      <h3 id="modal-titulo">Usuario</h3>
      <form id="form-usuario">
        <input type="hidden" id="usuario-id">
        <div><label>Nombre:</label><br><input type="text" id="nombre" required></div><br>
        <div><label>Apellidos:</label><br><input type="text" id="apellidos" required></div><br>
        <div><label>Correo:</label><br><input type="email" id="correo" required></div><br>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <button type="button" class="btn btn-danger" onclick="cerrarModal()">Cancelar</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
